[pytest]
# The service is a flat application rather than an installed package, so the
# project root is added to sys.path for imports like `from services...`.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
